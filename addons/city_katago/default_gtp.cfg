# Minimal KataGo config for in-process Eccentri City embed (Eigen / OpenCL later).
# Strength is overridden at load time via maxVisits.

rules = japanese
komi = 7.5

logToStderr = false
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false

allowResignation = false

maxVisits = 16
numSearchThreads = 2
numSearchThreadsPondering = 1
nnMaxBatchSize = 16

# Conservative CPU defaults for Eigen
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
