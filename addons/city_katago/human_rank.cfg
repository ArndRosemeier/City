# In-process Human-SL play config for Eccentri City.
# Load b18c384nbt-humanv0.bin.gz as the MAIN model (not -human-model).
# Strength is selected at runtime via katago_set_rank → humanSLProfile = rank_<token>.
# Dual-model-only keys (humanSLChosenMoveProp, explore probs, …) must NOT appear here.

rules = tromp-taylor
komi = 7.5

logToStderr = false
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false

allowResignation = false

# Modest visits: human net drives move choice via the rank profile; visits help
# pass/resign judgment and slight search smoothing.
maxVisits = 40
numSearchThreads = 1
numSearchThreadsPondering = 1
nnMaxBatchSize = 8

humanSLProfile = rank_5k

# Sample near the full human policy at this rank (see KataGo gtp_human5k_example).
chosenMoveTemperatureEarly = 0.85
chosenMoveTemperature = 0.70
chosenMoveTemperatureHalflife = 80
chosenMoveTemperatureOnlyBelowProb = 0.01
chosenMoveSubtract = 0
chosenMovePrune = 0

ignorePreRootHistory = false
rootNumSymmetriesToSample = 2
useLcbForSelection = false
winLossUtilityFactor = 1.0
staticScoreUtilityFactor = 0.30
dynamicScoreUtilityFactor = 0.00
useUncertainty = false
subtreeValueBiasFactor = 0.0
useNoisePruning = false

nnCacheSizePowerOfTwo = 17
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = true
